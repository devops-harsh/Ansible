---
# tasks file for ec2_instance
- name: start an instance with a public IP address
  vars:
   instance_type: "t3.micro"
  amazon.aws.ec2_instance:
    name: "public-compute-instance with name {{item.name}}" # this will change by our loops
    key_name: "ansible" # associate with existed key with name of ansible
    instance_type: "{{ instance_type }}"
    aws_access_key: "{{ aws_access_key }}" # jinja 2 template
    aws_secret_key: "{{ aws_secret_key }}"
    security_group: default
    network_interfaces:
      - assign_public_ip: true
        groups:
          - default
    image_id: "{{ item.image }}" # this will change from loop
    tags:
      Environment: "{{ item.name }}"
  loop:
    - { 
      image: "ami-01a00762f46d584a1",
      name: "managed-node-1"
    }
    - {
      image: "ami-01a00762f46d584a1",
      name: "managed-node-2"
    }
    - {
      image: "ami-0011550b539717e2a",
      name: "managed-node-3"
    }
  # loop_control: # this is index vars
      # index_var: index


